{% extends "layout.html" %}

{% block title %}Login | Smart Hostel CMS{% endblock %}

{% block content %}
<div class="auth-panel">
    <section class="auth-card">
        <h1>Login</h1>
        <form method="post" action="{{ url_for('auth.login') }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>
        <p class="hint">Admin default: <strong>admin</strong> / <strong>admin123</strong></p>
    </section>

    <section class="auth-card auth-secondary">
        <h2>Student Registration</h2>
        <form method="post" action="{{ url_for('auth.register') }}">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="room_number">Room Number</label>
            <input type="text" id="room_number" name="room_number">

            <label for="username-register">Username</label>
            <input type="text" id="username-register" name="username" required>

            <label for="password-register">Password</label>
            <input type="password" id="password-register" name="password" required>

            <button type="submit" name="add_student">Register</button>
        </form>
    </section>
</div>
{% endblock %}
